name: apply-dispatcher-audit

on:
  push:
    branches:
      - main
    paths:
      - '.dispatcher-audit/payload.gz'
      - '.github/workflows/apply-dispatcher-audit.yml'

permissions:
  contents: write

concurrency:
  group: apply-dispatcher-audit-main
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct and apply the reviewed audit patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .dispatcher-audit/payload.gz ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'Audit payload already consumed.'
            exit 0
          fi
          echo 'active=true' >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD^)" = '2d2cd39d052dd807833d82d7bb13f324db1ce4ae'
          echo '40783264d5b0e8f662115b4b48d425063b752b6f2fc9f7a400fdfb93fcf49908  .dispatcher-audit/payload.gz' | sha256sum --check --strict
          gzip -t .dispatcher-audit/payload.gz
          mkdir -p scripts
          gzip -dc .dispatcher-audit/payload.gz > scripts/.apply_dispatcher_audit.py
          echo 'b7de79334518b2047c5b5f03b901ca8106d59b7b1fa01b77e7ba753ccf190ffe  scripts/.apply_dispatcher_audit.py' | sha256sum --check --strict
          python scripts/.apply_dispatcher_audit.py
          rm -rf .dispatcher-audit scripts/.apply_dispatcher_audit.py
          git diff --check

      - name: Install development dependencies
        if: steps.apply.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff
        if: steps.apply.outputs.active == 'true'
        run: ruff check nightshift tests

      - name: Pytest
        if: steps.apply.outputs.active == 'true'
        run: pytest -q

      - name: Compile Python
        if: steps.apply.outputs.active == 'true'
        run: python -m compileall -q nightshift tests

      - name: Check browser JavaScript
        if: steps.apply.outputs.active == 'true'
        run: node --check nightshift/static/app.js

      - name: Build package
        if: steps.apply.outputs.active == 'true'
        run: python -m build

      - name: Publish fixes directly to main
        if: steps.apply.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build .pytest_cache
          find . -maxdepth 3 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -A
          git diff --cached --check
          test ! -e .dispatcher-audit
          test ! -e scripts/.apply_dispatcher_audit.py
          git config user.name 'OpenAI dispatcher auditor'
          git config user.email 'dispatcher-auditor@users.noreply.github.com'
          git commit \
            -m 'fix: harden dispatcher runtime and CLI contracts' \
            -m 'Support the current Grok streaming-json protocol, bind architect sessions to their missions, close Host/DNS-rebinding and rename-scope gaps, make integration rollback transactional, reset ignored architect side effects, bound child-output memory, and add focused regression coverage.'
          git push origin HEAD:main
