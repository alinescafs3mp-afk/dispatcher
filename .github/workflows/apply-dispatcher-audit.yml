name: apply-dispatcher-audit

on:
  push:
    branches:
      - main
    paths:
      - '.dispatcher-audit/**'
      - '.github/workflows/apply-dispatcher-audit.yml'

permissions:
  contents: write

concurrency:
  group: apply-dispatcher-audit-main
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct and apply the reviewed audit patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          payload_parts=(.dispatcher-audit/part-*)
          if (( ${#payload_parts[@]} == 0 )); then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'Audit payload already consumed.'
            exit 0
          fi
          echo 'active=true' >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD^)" = '11ef40e0c3185209dac2f1e7b9ef179234110498'
          cat "${payload_parts[@]}" > /tmp/dispatcher-audit.b64
          echo '8d8e2bb91020f4d39df90a731ab822671fe6d6679a98aed2f5d6c134d559e943  /tmp/dispatcher-audit.b64' | sha256sum --check --strict
          base64 --decode /tmp/dispatcher-audit.b64 > /tmp/dispatcher-audit.gz
          echo 'e7fb88f018aa5327681b6b22431fc752f86b390a90095f3f4800046368311485  /tmp/dispatcher-audit.gz' | sha256sum --check --strict
          gzip -t /tmp/dispatcher-audit.gz
          mkdir -p scripts
          gzip -dc /tmp/dispatcher-audit.gz > scripts/.apply_dispatcher_audit.py
          echo '4bf3a87b95ffcace9fe21519e3314e71f9c4dbcd498a3b3c72cc71ff6037df01  scripts/.apply_dispatcher_audit.py' | sha256sum --check --strict
          python scripts/.apply_dispatcher_audit.py
          rm -rf .dispatcher-audit scripts/.apply_dispatcher_audit.py
          git diff --check

      - name: Install development dependencies
        if: steps.apply.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff
        if: steps.apply.outputs.active == 'true'
        run: ruff check nightshift tests

      - name: Pytest
        if: steps.apply.outputs.active == 'true'
        run: pytest -q

      - name: Compile Python
        if: steps.apply.outputs.active == 'true'
        run: python -m compileall -q nightshift tests

      - name: Check browser JavaScript
        if: steps.apply.outputs.active == 'true'
        run: node --check nightshift/static/app.js

      - name: Build package
        if: steps.apply.outputs.active == 'true'
        run: python -m build

      - name: Publish fixes directly to main
        if: steps.apply.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build .pytest_cache
          find . -maxdepth 3 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -A
          git diff --cached --check
          test ! -e .dispatcher-audit
          test ! -e scripts/.apply_dispatcher_audit.py
          git config user.name 'OpenAI dispatcher auditor'
          git config user.email 'dispatcher-auditor@users.noreply.github.com'
          git commit \
            -m 'fix: harden dispatcher runtime and CLI contracts' \
            -m 'Support the current Grok streaming-json protocol, bind architect sessions to their missions, close Host/DNS-rebinding and rename-scope gaps, make integration rollback transactional, reset ignored architect side effects, bound child-output memory, and add focused regression coverage.'
          git push origin HEAD:main
