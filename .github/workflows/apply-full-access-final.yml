name: apply-full-access-final

on:
  push:
    branches:
      - main
    paths:
      - '.full-access-final/payload.b64'
      - '.github/workflows/apply-full-access-final.yml'

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct and apply the exact reviewed patch
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .full-access-final/payload.b64 ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'Payload already consumed; nothing to publish.'
            exit 0
          fi
          echo 'active=true' >> "$GITHUB_OUTPUT"
          test "$(git rev-parse bb2c76b944cc92f0d2431624f8f5b83ed4b2ab82^{tree})" = 'e0bc743570b3e2083db54dd86f16fc580fdc3db5'
          git merge-base --is-ancestor bb2c76b944cc92f0d2431624f8f5b83ed4b2ab82 HEAD
          echo 'b419e96436fabc12d657ece65990bbd1f3fe23a7d204471ec2925868d60b06c5  .full-access-final/payload.b64' | sha256sum --check --strict
          base64 --decode .full-access-final/payload.b64 > /tmp/full-access.patch.gz
          echo 'f37abea1da8fb024221ff4ccfe511678ea36666a698ed1aeff011911263a6a6b  /tmp/full-access.patch.gz' | sha256sum --check --strict
          gzip -t /tmp/full-access.patch.gz
          gzip -dc /tmp/full-access.patch.gz > /tmp/full-access.patch
          echo '3b128113dab430b30ab3c924478b66c6be70797d77717342edffe5186e80667d  /tmp/full-access.patch' | sha256sum --check --strict

          verification_index="$(mktemp)"
          rm -f "$verification_index"
          GIT_INDEX_FILE="$verification_index" git read-tree bb2c76b944cc92f0d2431624f8f5b83ed4b2ab82^{tree}
          GIT_INDEX_FILE="$verification_index" git apply --cached /tmp/full-access.patch
          test "$(GIT_INDEX_FILE="$verification_index" git write-tree)" = '257d7384a8f255c63f52d324110fd1cf5638b045'
          rm -f "$verification_index"

          git apply --check /tmp/full-access.patch
          git apply --index /tmp/full-access.patch
          git diff --cached --check

      - name: Install development dependencies
        if: steps.materialize.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff
        if: steps.materialize.outputs.active == 'true'
        run: ruff check nightshift tests

      - name: Pytest
        if: steps.materialize.outputs.active == 'true'
        run: pytest -q

      - name: Compile Python
        if: steps.materialize.outputs.active == 'true'
        run: python -m compileall -q nightshift tests

      - name: Check browser JavaScript
        if: steps.materialize.outputs.active == 'true'
        run: node --check nightshift/static/app.js

      - name: Build package
        if: steps.materialize.outputs.active == 'true'
        run: python -m build

      - name: Publish source directly to main
        if: steps.materialize.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build .pytest_cache .full-access-final
          find . -maxdepth 3 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -A
          git diff --cached --check
          test ! -e .full-access-final
          git config user.name 'OpenAI profile builder'
          git config user.email 'profile-builder@users.noreply.github.com'
          git commit \
            -m 'fix: grant Grok and Spark full access in both profiles' \
            -m 'Run every automated Sol, SolGoodman, Grok, Luna, and Spark turn with the operator-approved full host posture. Keep direct chats, explicit consultations, and predecessor recovery read-only. Preserve ~/.jericho as an explicit operational root without pretending host-side changes are automatically covered by repository Git integration.'
          git push origin HEAD:main
