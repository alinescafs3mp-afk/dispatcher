name: apply-profiles

on:
  push:
    branches:
      - feature-combat-reserve-profiles
    paths:
      - '.profiles/**'
      - '.github/workflows/apply-profiles.yml'

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Materialize profile-aware orchestrator
        run: python .profiles/run_profile_refactor.py
      - name: Apply safe lint corrections
        run: ruff check --fix nightshift tests
      - name: Complete verification
        shell: bash
        run: |
          set -euo pipefail
          ruff check nightshift tests
          python -m compileall -q nightshift tests
          node --check nightshift/static/app.js
          pytest -q
          python -m build
          git diff --check
      - name: Commit verified source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .profiles dist build
          rm -f .github/workflows/apply-profiles.yml
          find . -maxdepth 3 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'OpenAI profile builder'
          git config user.email 'profile-builder@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add combat and reserve operating profiles'
          git push origin "HEAD:${GITHUB_REF_NAME}"
