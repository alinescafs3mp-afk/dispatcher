name: apply-profiles

on:
  push:
    branches:
      - feature-combat-reserve-profiles
    paths:
      - '.profiles/**'
      - '.github/workflows/apply-profiles.yml'

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Materialize profile-aware orchestrator
        run: python .profiles/run_profile_refactor.py
      - name: Apply safe lint corrections
        id: lintfix
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check --fix nightshift tests 2>&1 | tee profile-ruff.log
      - name: Capture materialization diagnostics
        if: steps.lintfix.outcome == 'failure'
        run: |
          python -m compileall nightshift tests > profile-compile.log 2>&1 || true
      - name: Upload materialization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-materialization-diagnostics
          path: |
            profile-ruff.log
            profile-compile.log
          if-no-files-found: ignore
      - name: Fail after captured lint diagnostics
        if: steps.lintfix.outcome == 'failure'
        run: exit 1
      - name: Complete verification
        shell: bash
        run: |
          set -euo pipefail
          ruff check nightshift tests
          python -m compileall -q nightshift tests
          node --check nightshift/static/app.js
          pytest -q
          python -m build
          git diff --check
      - name: Commit verified source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .profiles dist build
          rm -f .github/workflows/apply-profiles.yml profile-ruff.log profile-compile.log
          find . -maxdepth 3 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'OpenAI profile builder'
          git config user.email 'profile-builder@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add combat and reserve operating profiles'
          git push origin "HEAD:${GITHUB_REF_NAME}"
