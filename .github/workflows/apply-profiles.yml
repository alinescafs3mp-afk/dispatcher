name: profile-final-verification

on:
  push:
    branches:
      - feature-combat-reserve-profiles

permissions:
  contents: read

jobs:
  snapshot-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Export exact source snapshot
        shell: bash
        run: |
          git archive --format=tar.gz --output=dispatcher-profile-source.tar.gz HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: dispatcher-profile-source
          path: dispatcher-profile-source.tar.gz
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Verify current branch
        shell: bash
        run: |
          set -euo pipefail
          ruff check nightshift tests
          python -m compileall -q nightshift tests
          node --check nightshift/static/app.js
          pytest -q
          python -m build
          git diff --check
