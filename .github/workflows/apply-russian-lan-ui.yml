name: apply-russian-lan-ui

on:
  push:
    branches:
      - main
    paths:
      - '.ru-lan-patch*'
      - '.github/workflows/apply-russian-lan-ui.yml'

permissions:
  contents: write

concurrency:
  group: apply-russian-lan-ui-main
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.actor == 'alinescafs3mp-afk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply reviewed dashboard and LAN patch
        run: |
          set -euo pipefail
          python .ru-lan-patch.py
          rm -f .ru-lan-patch.py .ru-lan-patch.[0-9][0-9] .github/workflows/apply-russian-lan-ui.yml
          git diff --check

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Verify changes
        run: |
          set -euo pipefail
          ruff check nightshift tests
          pytest -q
          python -m compileall -q nightshift tests
          node --check nightshift/static/app.js
          python -m build
          git diff --check

      - name: Publish directly to main
        run: |
          set -euo pipefail
          rm -rf dist build .pytest_cache
          find . -maxdepth 3 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -A
          git diff --cached --check
          test ! -e .ru-lan-patch.py
          test -z "$(find . -maxdepth 1 -name '.ru-lan-patch.[0-9][0-9]' -print -quit)"
          test ! -e .github/workflows/apply-russian-lan-ui.yml
          git config user.name 'OpenAI dispatcher auditor'
          git config user.email 'dispatcher-auditor@users.noreply.github.com'
          git commit -m 'feat: localize dashboard and enable LAN access' -m 'Translate dashboard controls and live status text to Russian, enlarge long-session typography, bind new installations to 0.0.0.0 with private-network Host protection, and suppress obsolete atk-bridge browser-launch chatter.'
          git push origin HEAD:main
