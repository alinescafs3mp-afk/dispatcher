name: audit-hardening

on:
  push:
    branches:
      - audit-hardening-20260902

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply audited hardening patch
        run: |
          cat .audit/chunk-* | base64 -d > .audit/apply.py.gz
          gzip -dc .audit/apply.py.gz > .audit/apply.py
          python .audit/apply.py
          rm -rf .audit
          rm -f .github/workflows/audit-hardening.yml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply safe Ruff fixes
        run: |
          set -o pipefail
          ruff check --fix nightshift tests 2>&1 | tee /tmp/audit-verification.log || true
      - name: Run complete verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          touch /tmp/audit-verification.log
          run_check() {
            printf '\n===== %s =====\n' "$*" | tee -a /tmp/audit-verification.log
            "$@" 2>&1 | tee -a /tmp/audit-verification.log
          }
          run_check ruff check nightshift tests
          run_check pytest -q
          run_check python -m compileall -q nightshift tests
          run_check node --check nightshift/static/app.js
          run_check python -m build
          run_check git diff --check
      - name: Persist exact diagnostics on failure
        if: steps.verify.outcome == 'failure'
        shell: bash
        run: |
          cp /tmp/audit-verification.log AUDIT_FAILURE.log
          rm -rf dist build
          find . -maxdepth 3 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'OpenAI audit bot'
          git config user.email 'audit-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: capture hardening verification failure'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit 1
      - name: Commit verified tree to audit branch
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          rm -rf dist build
          find . -maxdepth 3 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'OpenAI audit bot'
          git config user.email 'audit-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden orchestration and realtime dashboard'
          git push origin "HEAD:${GITHUB_REF_NAME}"
