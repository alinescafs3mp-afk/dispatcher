name: audit-verify

on:
  push:
    branches:
      - audit-hardening-20260902

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run complete verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/audit-verification.txt
          run_check() {
            printf '\n===== %s =====\n' "$*" | tee -a /tmp/audit-verification.txt
            "$@" 2>&1 | tee -a /tmp/audit-verification.txt
          }
          run_check ruff check nightshift tests
          run_check pytest -q
          run_check python -m compileall -q nightshift tests
          run_check node --check nightshift/static/app.js
          run_check python -m build
          run_check git diff --check
      - name: Persist exact diagnostics on failure
        if: steps.verify.outcome == 'failure'
        shell: bash
        run: |
          cp /tmp/audit-verification.txt AUDIT_FAILURE.txt
          rm -f .github/workflows/audit-verify.yml
          rm -rf dist build
          find . -maxdepth 3 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'OpenAI audit bot'
          git config user.email 'audit-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: capture audit verification diagnostics'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit 1
      - name: Finalize verified audit tree
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          rm -f .github/workflows/audit-verify.yml AUDIT_FAILURE.txt
          rm -rf dist build
          find . -maxdepth 3 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'OpenAI audit bot'
          git config user.email 'audit-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden orchestration and realtime dashboard'
          git push origin "HEAD:${GITHUB_REF_NAME}"
