name: cleanup-profile-catchup

on:
  push:
    branches:
      - profile-final-catchup
    paths:
      - '.github/workflows/cleanup-profile-catchup.yml'

permissions:
  contents: write

jobs:
  verify-main-and-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify promoted main tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          git checkout --detach origin/main
          git log -1 --format='%s' | grep -Fq 'operational roots'
          grep -R -q --exclude-dir='__pycache__' '\.jericho' nightshift tests README.md docs nightshift.example.toml
          grep -R -q --exclude-dir='__pycache__' 'operational_root' nightshift tests
          test ! -e .catchup-final
          test ! -e .github/workflows/export-current-main.yml
          test ! -e .github/workflows/finalize-profile-catchup.yml
          test ! -e .github/workflows/promote-operational-roots.yml

      - name: Delete completed technical branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          delete_ref() {
            local branch="$1"
            local code
            code="$(curl --silent --show-error --output /tmp/delete-${branch}.json --write-out '%{http_code}' \
              --request DELETE \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}")"
            if [[ "$code" != 204 && "$code" != 404 && "$code" != 422 ]]; then
              cat "/tmp/delete-${branch}.json"
              exit 1
            fi
          }
          delete_ref release-profile-operational-roots
          delete_ref profile-final-catchup
