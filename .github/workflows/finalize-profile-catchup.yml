name: finalize-profile-catchup

on:
  push:
    branches:
      - profile-final-catchup
    paths:
      - '.catchup-final/READY'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct exact catch-up delta
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee transport.log) 2>&1
          wc -c .catchup-final/payload-*.b64
          head -c 20000 .catchup-final/payload-00.b64 > /tmp/payload-00.exact.b64
          echo 'c6279cd21f13cf23fd2a685e16bb22fb4f2a94cee4ac7904dd85224cf59d2946  /tmp/payload-00.exact.b64' | sha256sum --check --strict
          cat /tmp/payload-00.exact.b64 \
              .catchup-final/payload-01.b64 \
              .catchup-final/payload-02.b64 \
              .catchup-final/payload-03.b64 \
            | tr -d '\n' > /tmp/profile-catchup.patch.b64
          test "$(wc -c < /tmp/profile-catchup.patch.b64)" = '77108'
          base64 --decode /tmp/profile-catchup.patch.b64 > /tmp/profile-catchup.patch.gz
          echo '89cbfab6485093de5ffcff43d18677dc50306bb28c71eb9bcd0b05a8b9411c56  /tmp/profile-catchup.patch.gz' | sha256sum --check --strict
          gzip -t /tmp/profile-catchup.patch.gz
          gzip -dc /tmp/profile-catchup.patch.gz > /tmp/profile-catchup.patch
          echo 'ffac34f97a21a501daaca499b72ae7e655b425f02558f08e8149ff3c6a5d4b5c  /tmp/profile-catchup.patch' | sha256sum --check --strict

      - name: Rebuild from exact current main tree
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 7d8ab1907dfa31269dc6fc86137dcd0a5ff82756
          git clean -fdx
          test "$(git rev-parse HEAD^{tree})" = '536d4624c0d5ebb393e9db9193edbdd9208c15ea'
          git apply --check /tmp/profile-catchup.patch
          git apply --index /tmp/profile-catchup.patch
          test "$(git write-tree)" = '478cb94c76fe048c2cbb7d7cf4c9e08f2ab9e490'
          test ! -e .catchup-final
          test ! -e .github/workflows/export-current-main.yml
          test ! -e .github/workflows/finalize-profile-catchup.yml
          git diff --cached --check

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check nightshift tests 2>&1 | tee ruff.log

      - name: Pytest
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -q --junitxml=pytest.xml 2>&1 | tee pytest.log

      - name: Compile Python
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q nightshift tests 2>&1 | tee compile.log

      - name: Check browser JavaScript
        id: javascript
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --check nightshift/static/app.js 2>&1 | tee javascript.log

      - name: Build package
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m build 2>&1 | tee build.log

      - name: Check staged tree hygiene
        id: diff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git diff --cached --check 2>&1 | tee diff.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-catchup-diagnostics
          path: |
            transport.log
            ruff.log
            pytest.log
            pytest.xml
            compile.log
            javascript.log
            build.log
            diff.log
          if-no-files-found: ignore

      - name: Verification gate
        if: always()
        shell: bash
        run: |
          test '${{ steps.ruff.outcome }}' = success
          test '${{ steps.pytest.outcome }}' = success
          test '${{ steps.compile.outcome }}' = success
          test '${{ steps.javascript.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.diff.outcome }}' = success

      - name: Commit verified final profile tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build
          find . -maxdepth 3 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f transport.log ruff.log pytest.log pytest.xml compile.log javascript.log build.log diff.log
          git add -A
          test "$(git write-tree)" = '478cb94c76fe048c2cbb7d7cf4c9e08f2ab9e490'
          git config user.name 'OpenAI profile builder'
          git config user.email 'profile-builder@users.noreply.github.com'
          git commit -m 'fix: complete combat profile routing and consultations'
          git push --force-with-lease=refs/heads/${GITHUB_REF_NAME}:${GITHUB_SHA} origin "HEAD:${GITHUB_REF_NAME}"
