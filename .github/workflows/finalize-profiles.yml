name: finalize-profiles

on:
  push:
    branches:
      - feature-combat-reserve-profiles
    paths:
      - '.profile-final/**'
      - '.github/workflows/finalize-profiles.yml'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct and verify final patch
        shell: bash
        run: |
          set -euo pipefail
          cat .profile-final/chunk-*.b64 | tr -d '\n' | base64 --decode > /tmp/profile-final.patch.gz
          gzip -dc /tmp/profile-final.patch.gz > /tmp/profile-final.patch
          echo 'bef2ea6051b301c16df6188160b213b3861de95d07f30ae937d89755ba8ff76f  /tmp/profile-final.patch' | sha256sum --check --strict
          git apply --check /tmp/profile-final.patch
          git apply --index /tmp/profile-final.patch
          rm -rf .profile-final
          rm -f .github/workflows/finalize-profiles.yml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check nightshift tests 2>&1 | tee ruff.log

      - name: Pytest
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -q --junitxml=pytest.xml 2>&1 | tee pytest.log

      - name: Compile Python
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q nightshift tests 2>&1 | tee compile.log

      - name: Check browser JavaScript
        id: javascript
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --check nightshift/static/app.js 2>&1 | tee javascript.log

      - name: Build package
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m build 2>&1 | tee build.log

      - name: Check patch hygiene
        id: diff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee diff.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-final-diagnostics
          path: |
            ruff.log
            pytest.log
            pytest.xml
            compile.log
            javascript.log
            build.log
            diff.log
          if-no-files-found: ignore

      - name: Verification gate
        if: always()
        shell: bash
        run: |
          test '${{ steps.ruff.outcome }}' = success
          test '${{ steps.pytest.outcome }}' = success
          test '${{ steps.compile.outcome }}' = success
          test '${{ steps.javascript.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.diff.outcome }}' = success

      - name: Commit verified profile implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build
          find . -maxdepth 3 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'OpenAI profile builder'
          git config user.email 'profile-builder@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: finish combat and reserve operating profiles'
          git push origin "HEAD:${GITHUB_REF_NAME}"
