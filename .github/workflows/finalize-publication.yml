name: finalize-publication

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply publication cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("dispatcher.py")
          if source.exists():
              text = source.read_text(encoding="utf-8")
              text = text.replace(
                  "Act as accepting architect.",
                  "Act as the accepting architect.",
              )
              text = text.replace(
                  "<span>${Math.round(w.remaining_percent)}% left</span>",
                  "<span>${Math.round(w.remaining_percent)}% left${w.resets_at?' · resets '+new Date(typeof w.resets_at==='number'?w.resets_at*1000:w.resets_at).toLocaleString():''}</span>",
              )
              source.write_text(text, encoding="utf-8")

          for path in (
              Path(".github-write-probe"),
              Path("SMOKE_TESTED"),
              Path(".github/workflows/finalize-publication.yml"),
          ):
              path.unlink(missing_ok=True)
          PY
      - name: Commit cleanup when needed
        run: |
          git config user.name "Friday Dispatcher Bot"
          git config user.email "dispatcher-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize dispatcher publication"
            git push
          fi
