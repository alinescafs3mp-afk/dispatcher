name: tests

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'

      - name: Ruff
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check nightshift tests 2>&1 | tee ruff.log

      - name: Pytest
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -q --junitxml=pytest.xml 2>&1 | tee pytest.log

      - name: Python compile
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q nightshift tests 2>&1 | tee compile.log

      - name: Frontend syntax
        id: frontend
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --check nightshift/static/app.js 2>&1 | tee frontend.log

      - name: Package build
        id: package
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m build 2>&1 | tee package.log

      - name: Patch hygiene
        id: diff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee diff.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            ruff.log
            pytest.log
            pytest.xml
            compile.log
            frontend.log
            package.log
            diff.log
          if-no-files-found: ignore

      - name: Quality gate
        if: always()
        run: |
          test '${{ steps.ruff.outcome }}' = success
          test '${{ steps.pytest.outcome }}' = success
          test '${{ steps.compile.outcome }}' = success
          test '${{ steps.frontend.outcome }}' = success
          test '${{ steps.package.outcome }}' = success
          test '${{ steps.diff.outcome }}' = success
