name: tests

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: ruff check nightshift tests 2>&1 | tee ruff.log
      - name: Pytest
        id: pytest
        continue-on-error: true
        run: pytest -q --junitxml=pytest.xml 2>&1 | tee pytest.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            ruff.log
            pytest.log
            pytest.xml
          if-no-files-found: ignore
      - name: Quality gate
        if: always()
        run: |
          test '${{ steps.ruff.outcome }}' = success
          test '${{ steps.pytest.outcome }}' = success
