[server]
host = "127.0.0.1"
port = 8765
state_dir = "~/.local/state/friday-dispatcher"
project_root = "/absolute/path/to/Friday"
limit_poll_seconds = 180
process_timeout_seconds = 7200
max_tasks = 50
max_review_rounds = 2
keep_task_worktrees = false

[agents.grok]
display_name = "Grok Architect"
role = "chief architect and reviewer"
command = ["grok-build"]
model = "grok-4.6"
reasoning = "xhigh"
reasoning_options = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]
max_turns = 120
sandbox = "read-only"

[agents.luna]
display_name = "Luna Goodman"
role = "implementation owner"
command = ["codex-solgoodman"]
model = "gpt-5.6-luna"
reasoning = "high"
reasoning_options = ["low", "medium", "high", "xhigh", "max"]
max_turns = 80
sandbox = "workspace-write"

[agents.spark]
display_name = "Codex Spark"
role = "micro-implementation worker"
command = ["codex"]
model = "gpt-5.3-codex-spark"
reasoning = "medium"
reasoning_options = ["low", "medium", "high", "xhigh"]
max_turns = 50
sandbox = "workspace-write"

[sol_link]
enabled = false
# inbox = "/absolute/path/to/legacy/sol-link/events.jsonl"
poll_seconds = 1.0
